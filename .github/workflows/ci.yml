name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        components: clippy, rustfmt

    - name: Rust Cache
      uses: Swatinem/rust-cache@v2

    - name: Install dependencies (Linux)
      run: |
        sudo apt-get update
        # rfd uses the xdg portal (no GTK) and the release workflow builds
        # with no system packages at all; the old GTK/WebKit list broke when
        # ubuntu-latest moved to 26.04 (libgdk-pixbuf2.0-dev is gone there).
        sudo apt-get install -y libxkbcommon-dev

    - name: Check
      run: cargo check --verbose

    - name: Clippy
      run: cargo clippy --all-targets -- -D warnings

    # fast-jpeg swaps in its own decode paths, and profiling its measuring
    # code, so the default lint never sees them.
    - name: Clippy (fast-jpeg, profiling)
      run: cargo clippy --all-targets --features fast-jpeg,profiling -- -D warnings

    - name: Test
      run: cargo test --verbose

    - name: Test (profiling)
      run: cargo test -p raw-editor-core --features profiling core::profiler

  # The ignored tests that need a GPU, on lavapipe (Mesa's software Vulkan).
  # One at a time: wgpu's GL backend fails in parallel, and they share one
  # device's worth of memory. Tests on the developer's own photos skip
  # themselves here; the ones that need the network, the AI models or the
  # desktop trash, and the tuning tools, are skipped explicitly.
  gpu:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
    - uses: actions/checkout@v4

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable

    - name: Rust Cache
      uses: Swatinem/rust-cache@v2

    - name: Install dependencies (Linux)
      run: |
        sudo apt-get update
        sudo apt-get install -y libxkbcommon-dev mesa-vulkan-drivers

    # The AI models (~130 MB) from this repo's models-v1 release, checked
    # against the hashes ml::models pins, and cached until those change.
    - name: AI models (cache)
      id: models
      uses: actions/cache@v4
      with:
        path: models
        key: ai-models-${{ hashFiles('crates/raw-editor-core/src/ml/models.rs') }}

    - name: AI models (download)
      if: steps.models.outputs.cache-hit != 'true'
      run: |
        mkdir -p models
        awk '/name: "/{gsub(/[",]/,"",$2); n=$2} /sha256: "/{gsub(/[",]/,"",$2); print $2"  "n}' \
          crates/raw-editor-core/src/ml/models.rs > models/SHA256SUMS
        url=$(grep -A1 'pub const RELEASE_URL' crates/raw-editor-core/src/ml/models.rs | grep -o 'https://[^"]*')
        cd models
        for f in $(awk '{print $2}' SHA256SUMS); do curl -fsSL --retry 3 -o "$f" "$url$f"; done
        sha256sum -c SHA256SUMS

    - name: GPU tests
      env:
        RAWEDITOR_MODELS_DIR: ${{ github.workspace }}/models
      run: >
        cargo test --workspace -- --ignored --test-threads=1
        --skip nr_sweep --skip presence_dump --skip bench_slider_ticks
        --skip trash_crate_moves_file
        --skip camera_profile_download --skip lensfun_download
