name: RawEditor CI & Release

on:
  push:
    branches: [ "main" ]
    # V* and bare numbers too, so a mistyped tag fails the version check
    # instead of being silently ignored. (models-v1 matches none of these.)
    tags: [ "v*", "V*", "[0-9]*" ]
    paths-ignore:
      - "README.md"
      - "LICENSE"

permissions:
  contents: write


jobs:
  release:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        # macos-15 is an Apple Silicon runner, so the arm64 build is
        # native rather than cross-compiled.
        os: [ubuntu-latest, windows-latest, macos-15]

    steps:
      - uses: actions/checkout@v4

      # actions-rs/toolchain is archived and runs on a deprecated Node
      # runtime; dtolnay/rust-toolchain is the maintained equivalent.
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      # Cargo.toml is the source of truth for the version: a release is
      # "bump it, commit, tag v<that version>". The tag must match exactly,
      # so a missing or capital v, a letter suffix (v0.9.8E, which semver
      # orders BEFORE 0.9.8, so the updater would offer it backwards) or a
      # forgotten bump fails here instead of shipping a mislabelled build.
      # Pre-releases are semver: v1.0.0-rc.1 with version = "1.0.0-rc.1".
      - name: Check the tag matches Cargo.toml
        shell: bash
        run: |
          VERSION=$(sed -n 's/^version *= *"\(.*\)"/\1/p' Cargo.toml | head -1)
          if [[ "$GITHUB_REF_NAME" != "v$VERSION" ]]; then
            echo "::error::Tag '$GITHUB_REF_NAME' doesn't match Cargo.toml's version $VERSION: expected tag v$VERSION"
            exit 1
          fi
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Cargo.toml's version $VERSION is not x.y.z or x.y.z-pre"
            exit 1
          fi
          echo "Building $VERSION"

      - name: Build release
        if: matrix.os != 'macos-15'
        run: cargo build --release

      # Apple Silicon only ships arm64 Macs, so the build can assume more than
      # the generic aarch64 baseline: `apple-m1` turns on the M1's ISA
      # extensions (and its scheduling model) while still running on every
      # M-series chip. `fast-jpeg` adds zune-jpeg's NEON decoder.
      - name: Build release (Apple Silicon)
        if: matrix.os == 'macos-15'
        env:
          RUSTFLAGS: -C target-cpu=apple-m1
          # 13.4: ONNX Runtime's prebuilt library (ort) is built for it.
          MACOSX_DEPLOYMENT_TARGET: "13.4"
        run: cargo build --release --target aarch64-apple-darwin --features fast-jpeg

      - name: Prepare release directory (Linux)
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          APP=raw-editor
          VERSION=${GITHUB_REF_NAME}

          mkdir -p dist/$APP-linux

          cp target/release/$APP dist/$APP-linux/
          cp -r assets dist/$APP-linux/
          cp README.md dist/$APP-linux/ || true
          cp LICENSE dist/$APP-linux/ || true

          cd dist
          zip -r "$APP-linux-$VERSION.zip" "$APP-linux"

      - name: Prepare release directory (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $APP = "raw-editor"
          $VERSION = "${env:GITHUB_REF_NAME}"
          $OUT = "dist\$APP-windows"

          New-Item -ItemType Directory -Force -Path $OUT | Out-Null

          Copy-Item "target\release\$APP.exe" $OUT
          Copy-Item "assets" $OUT -Recurse
          Copy-Item "README.md" $OUT -ErrorAction SilentlyContinue
          Copy-Item "LICENSE" $OUT -ErrorAction SilentlyContinue

          Compress-Archive -Path $OUT -DestinationPath "dist\$APP-windows-$VERSION.zip"

      - name: Prepare app bundle (Apple Silicon)
        if: matrix.os == 'macos-15'
        shell: bash
        run: |
          APP=raw-editor
          VERSION=${GITHUB_REF_NAME}
          BUNDLE="dist/RawEditor.app"

          mkdir -p "$BUNDLE/Contents/MacOS" "$BUNDLE/Contents/Resources"
          cp target/aarch64-apple-darwin/release/$APP "$BUNDLE/Contents/MacOS/"
          cp -r assets "$BUNDLE/Contents/Resources/"
          cp README.md LICENSE "$BUNDLE/Contents/Resources/" 2>/dev/null || true

          # Dock / Finder icon: every size iconutil expects, from the one PNG.
          ICONSET="$RUNNER_TEMP/RawEditor.iconset"
          mkdir -p "$ICONSET"
          for s in 16 32 128 256 512; do
            sips -z $s $s assets/icon.png --out "$ICONSET/icon_${s}x${s}.png" >/dev/null
            sips -z $((s * 2)) $((s * 2)) assets/icon.png --out "$ICONSET/icon_${s}x${s}@2x.png" >/dev/null
          done
          iconutil -c icns "$ICONSET" -o "$BUNDLE/Contents/Resources/RawEditor.icns"

          cat > "$BUNDLE/Contents/Info.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleName</key><string>RawEditor</string>
            <key>CFBundleDisplayName</key><string>RawEditor</string>
            <key>CFBundleIdentifier</key><string>io.github.happyslappyface.raweditor</string>
            <key>CFBundleExecutable</key><string>$APP</string>
            <key>CFBundleIconFile</key><string>RawEditor</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>${VERSION#v}</string>
            <key>CFBundleVersion</key><string>${VERSION#v}</string>
            <key>LSMinimumSystemVersion</key><string>13.4</string>
            <key>LSArchitecturePriority</key><array><string>arm64</string></array>
            <key>NSHighResolutionCapable</key><true/>
          </dict>
          </plist>
          EOF

          # Ad-hoc signature. Not notarised, but without any signature a
          # downloaded arm64 app is reported as "damaged" rather than offering
          # the right-click › Open override.
          codesign --force --deep --sign - "$BUNDLE"

          # ditto keeps the bundle's metadata and signature intact; plain zip
          # does not.
          cd dist
          ditto -c -k --keepParent RawEditor.app "$APP-macos-arm64-$VERSION.zip"


      - name: Upload artifact (CI)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.os }}-zip
          path: dist/*.zip

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          # v1.0.0-rc.1 etc.: a pre-release is never "latest", so the
          # update check (which reads the latest release) never offers it.
          prerelease: ${{ contains(github.ref_name, '-') }}

  # The app's update check reads latest.json from the newest release
  # (core::updates). It is written here, after every platform has uploaded,
  # so it never names a download that isn't there yet — while a release is
  # still building the file is simply missing, and the check finds nothing.
  manifest:
    needs: release
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: "*-zip"
          path: dist
          merge-multiple: true

      - name: Write and upload latest.json
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The release job already checked the tag is v<Cargo.toml version>.
          VERSION="${GITHUB_REF_NAME#v}"

          # Keys are the app's core::updates::platform(): "<os>-<arch>" as
          # Rust's std::env::consts spells them.
          assets='{}'
          for f in dist/*.zip; do
            name=$(basename "$f")
            case "$name" in
              *-linux-*)       key=linux-x86_64 ;;
              *-windows-*)     key=windows-x86_64 ;;
              *-macos-arm64-*) key=macos-aarch64 ;;
              *) echo "::warning::not listed in latest.json: $name"; continue ;;
            esac
            assets=$(jq -c --arg k "$key" --arg file "$name" \
              --arg sha "$(sha256sum "$f" | cut -d' ' -f1)" --argjson bytes "$(stat -c%s "$f")" \
              '. + {($k): {file: $file, sha256: $sha, bytes: $bytes}}' <<<"$assets")
          done
          [ "$(jq length <<<"$assets")" -gt 0 ] || { echo "::error::no release zips found"; exit 1; }

          jq -n --arg version "$VERSION" --arg tag "$GITHUB_REF_NAME" \
            --arg url "https://github.com/$GITHUB_REPOSITORY/releases/tag/$GITHUB_REF_NAME" \
            --arg published "$(date -u +%Y-%m-%dT%H:%M:%SZ)" --argjson assets "$assets" \
            '{format: 1, version: $version, tag: $tag, url: $url, published: $published, assets: $assets}' > latest.json
          cat latest.json
          gh release upload "$GITHUB_REF_NAME" latest.json --clobber --repo "$GITHUB_REPOSITORY"
