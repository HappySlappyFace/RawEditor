[package]
name = "raw-editor-session"
version.workspace = true
edition.workspace = true
authors.workspace = true
description = "RawEditor's editing session: the app's logic, independent of any UI toolkit"
license.workspace = true
publish = false

[dependencies]
# The engine: GPU pipeline, RAW decoding, colour science, catalogue, AI.
raw-editor-core.workspace = true

tokio.workspace = true
tracing.workspace = true
rusqlite.workspace = true
dirs.workspace = true
cgmath.workspace = true
image.workspace = true
kamadak-exif.workspace = true
# The RAM cache of decoded RAWs.
lru = "0.12"
# Recursive directory traversal (import).
walkdir = "2.4"
# Direct encoders for export (avoiding image crate high-level APIs).
png.workspace = true
jpeg-encoder = "0.6"
tiff.workspace = true

zune-jpeg = { workspace = true, optional = true }
zune-core = { workspace = true, optional = true }

[features]
default = []
# 3-5x faster JPEG decoding via zune-jpeg (see the app's manifest).
fast-jpeg = ["dep:zune-jpeg", "dep:zune-core", "raw-editor-core/fast-jpeg"]
# Fixtures for front ends' tests (`session::testkit`, `AiSelect::for_test`).
test-support = ["raw-editor-core/test-support"]
# The detailed performance overlay (see the engine's manifest).
profiling = ["raw-editor-core/profiling"]

[dev-dependencies]
raw-editor-core = { workspace = true, features = ["test-support"] }
# A stand-in surface for the surface-frame tests; the engine's own version.
wgpu.workspace = true

# Delete moves files to the system trash. The crate has no backend on Android
# or iOS, where Delete reports that it can't (`delete::trash_or_missing`).
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
trash = "5.2.6"
