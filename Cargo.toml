[workspace]
members = [".", "crates/raw-editor-core"]
# Plain `cargo build/test/clippy` at the root cover the whole workspace, so the
# commands in CLAUDE.md and CI keep checking the engine too.
default-members = [".", "crates/raw-editor-core"]
resolver = "2"

# The release version for every crate. This is the line a release bumps (the
# release workflow reads the first `version = "…"` in this file).
[workspace.package]
version = "0.9.26"
edition = "2021"
authors = ["Ayman REBAI"]
license = "MIT"

# Versions used by more than one crate, so the app and the engine can't drift.
[workspace.dependencies]
raw-editor-core = { path = "crates/raw-editor-core" }

# Async runtime for background tasks
# "time" powers the export memory-pressure retry. It currently arrives
# transitively via iced_futures, but relying on that would make an iced update
# able to turn `tokio::time::sleep` into a runtime panic.
# "rt-multi-thread": the engine's render entry points call
# `tokio::task::block_in_place`, which needs it. It used to arrive only through
# iced, so the engine crate did not build on its own.
tokio = { version = "1", features = ["rt", "rt-multi-thread", "fs", "sync", "time"] }

# Database for catalog management (bundled = includes SQLite, no system dependency)
rusqlite = { version = "0.32", features = ["bundled"] }

# Standard library for paths and directories
dirs = "5.0"

bytemuck = { version = "1.14", features = ["derive"] }

# Matrix math for color space conversions (Phase 15)
cgmath = "0.18"

# Image processing (decode, resize, save thumbnails)
image = "0.25"

# Phase 64 / Phase 119: EXIF parsing (rawler doesn't expose Exif on RawImage, so we keep kamadak-exif)
kamadak-exif = "0.5"

zune-jpeg = "0.4"
zune-core = "0.4"

png = "0.17"
tracing = "0.1"
# The engine's GPU API. The same version, with the same (default) features, as
# iced's renderer, so Cargo builds one wgpu for both.
wgpu = "0.19"
tiff = "0.9"

[package]
name = "raw-editor"
version.workspace = true
edition.workspace = true
authors.workspace = true
description = "A native RAW photo editor"
license.workspace = true

[dependencies]
# The engine: GPU pipeline, RAW decoding, colour science, catalogue, AI.
raw-editor-core.workspace = true

# GUI framework with native rendering via wgpu
iced = { version = "0.13", features = ["wgpu", "tokio", "image", "advanced", "canvas"] }

# Additional widgets for iced: the menu for the title bar's dropdowns. The
# feature is dependency-free (`menu = []`), so this costs compile time only.
iced_aw = { version = "0.10", default-features = false, features = ["menu"] }

tokio.workspace = true
rusqlite.workspace = true
dirs.workspace = true

# Native file/folder picker dialogs
rfd = "0.18"

# Recursive directory traversal
walkdir = "2.4"

# Better error handling with derive macros
thiserror = "1.0"

bytemuck.workspace = true
cgmath.workspace = true
image.workspace = true
kamadak-exif.workspace = true
lru = "0.12"

zune-jpeg = { workspace = true, optional = true }
zune-core = { workspace = true, optional = true }

# Direct encoders for export (avoiding image crate high-level APIs)
png.workspace = true
jpeg-encoder = "0.6"
tracing.workspace = true
tiff.workspace = true
trash = "5.2.6"


[dev-dependencies]
# The engine's test fixtures, for the app's message-level tests.
raw-editor-core = { workspace = true, features = ["test-support"] }
# Only for the GPU tests that drive the editor (`app::tests::gpu_render`); app
# code never touches wgpu (CLAUDE.md, constraint 6).
wgpu.workspace = true
# Runs `update`'s returned tasks outside iced's event loop, for the render
# benchmark (`app::tests::gpu_render::bench_slider_ticks`). Already in the
# tree as iced's runtime; same version.
iced_runtime = "0.13"

[target.'cfg(windows)'.build-dependencies]
# Embeds assets/icon.ico so the .exe itself has an icon in Explorer.
winresource = "0.1"

[features]
# Default: maximum compatibility — no platform-specific dependencies.
# Enable "fast-jpeg" for 3-5× faster JPEG decoding via zune-jpeg (SIMD on x86_64/aarch64,
# scalar fallback elsewhere). See .cargo/config.toml for one-line aliases.
default = []
fast-jpeg = ["dep:zune-jpeg", "dep:zune-core", "raw-editor-core/fast-jpeg"]

[profile.release]
# Maximum performance optimizations
opt-level = 3
lto = true
codegen-units = 1
strip = true

# Day-to-day runs: release speed for the app itself, without the whole-program
# optimisation that makes `--release` take minutes. About a minute from clean,
# seconds after a small change. Not for shipping: CI builds `--release`.
#   cargo run-quick
[profile.quick]
inherits = "release"
lto = false
codegen-units = 16
incremental = true
strip = false
